<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">PS1-02 Register: cart lines + purchase-limit meter (amber)  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Line: name · batch · − weight + (steps through 3.5/7/14/28, disabled where jar grams &lt; weight) · line price (pre-tax) · ✕ remove. Totals sum the lines; tax once on the cart.</text>
<text x="24" y="1176" font-size="19" fill="#222">Meter = cart flower g / 28 g. Neutral under 75 % (mark), ⚠ amber 75–100 %, ✗ red over. Status = icon + word, never colour only. Concentrate row appears in PS3 (5 g).</text>
<text x="24" y="1202" font-size="19" fill="#222">Focus: line 1 (↑↓ lines, ← → or −/+ weight, Del remove) → + Add item → Confirm → Cancel. '+ Add item' returns to Query with the request strip.</text>
</svg>