<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-03 Terminal: query  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Intent tiles = the 6 slice intent families; each maps to one INTENTS key (DES-001 owns the mapping). Multi-select merges per contract §2.9 (crit=max, neg=min).</text>
<text x="24" y="1176" font-size="19" fill="#222">Player picks intents from what they heard: interpretation is the skill (spec §14). Assist 'Auto-fill intent' pre-selects the NPC's emitted key.</text>
<text x="24" y="1202" font-size="19" fill="#222">Focus: tiles (←→) → Budget (−/+ steppers, $5 steps) → Stay functional toggle → Search. Tiles 236×80, text 24.</text>
</svg>