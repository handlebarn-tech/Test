<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">CX-02 Query: preview of the wording sent to the TFS tool  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Preview = the exact text the composer (GAME-017) passes to QueryParser; never edited free-hand. Known facts arrive as tokens (on by default); ✕/Del drops one. Liked/disliked strains are not wording.</text>
<text x="24" y="1176" font-size="19" fill="#222">Chips stay the quick path: a tile sets the effect token and the preview shows its canonical wording (chip-only = DEC-017 golden parse). Hidden facts can never appear here (QA-002 gate).</text>
<text x="24" y="1202" font-size="19" fill="#222">Similar shows only when a liked strain is KNOWN (Q6, later repeat memory). Cost tag in words, no seconds or bars. The CUSTOMER INFO tag lives in the strip, never on a card.</text>
</svg>