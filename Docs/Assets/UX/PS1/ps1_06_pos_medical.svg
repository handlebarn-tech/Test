<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">PS1-06 Register: medical customer (MED badge, 14-day meter)  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">MED badge replaces '21+ ID verified'. Meter = cart flower g / (70.87 g − 14-day history); 28 g cap does not apply; amber/red rules as the flower meter.</text>
<text x="24" y="1176" font-size="19" fill="#222">Tax line reads 'Tax 9.1% (medical)'; same pre-tax line prices as adult-use (DEC-048). Sale type switch defaults to Medical; Adult-use swaps tax + meter to 28 g.</text>
<text x="24" y="1202" font-size="19" fill="#222">Medical customers are rare (&lt; 5 %, DEC-048). Payment row moves to the right of Sale type in the build (omitted here for space).</text>
</svg>