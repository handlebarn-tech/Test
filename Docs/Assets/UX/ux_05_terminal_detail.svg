<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-05 Terminal: detail (inspect)  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Detail = the tool's expand panel, opt-in only (spec §13 detailed view). Every block carries its evidence tag (MASTER_PLAN §4.3): OBSERVED / INFERRED / HEURISTIC.</text>
<text x="24" y="1176" font-size="19" fill="#222">Bars show display_d (2-99) for 5 domains; antimicrobial is never shown. Saturation at 99 kept for parity (GAP-208). Values here are illustrative.</text>
<text x="24" y="1202" font-size="19" fill="#222">Focus starts on Choose; Back returns to results with the same card focused. Tue prices from contract §12 (house tier).</text>
</svg>