<text x="124" y="186" font-size="16" font-weight="400" fill="#8f98a5" text-anchor="start">hint: first wrong Confirm only; after that = strike</text>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">PS1-07 Register: out-of-state medical card  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Cue is the badge only ('⚠ Card: out-of-state'); no banner up front, so spotting it is the decision (SPEC_COMP002 §4, GAP-COMP-04).</text>
<text x="24" y="1176" font-size="19" fill="#222">Confirm as Medical: 1st time blocked + hint toast; later times blocked + strike. Switching to Adult-use: tax 25.1 %, meter becomes Flower / 28 g.</text>
<text x="24" y="1202" font-size="19" fill="#222">Switch key: T toggles Sale type (mouse: click). Normal POS focus order; marker 1 only points at the switch.</text>
</svg>