<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1230" viewBox="0 0 1920 1230" font-family="Segoe UI, Arial, sans-serif">
<title>UX-02 Dialogue: request + clarifying questions</title>
<rect width="1920" height="1080" fill="#15181c"/>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#2b3038" stroke="none" stroke-width="2"/>
<text x="960.0" y="470" font-size="28" font-weight="400" fill="#4a525e" text-anchor="middle">customer at counter</text>
<rect x="1484" y="70" width="324" height="128" rx="10" fill="#0f1215cc" stroke="none" stroke-width="2"/>
<text x="1508" y="112" font-size="26" font-weight="600" fill="#f2f4f7" text-anchor="start">◷ 2:47 PM</text>
<text x="1508" y="150" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">$ 412.35 shift sales</text>
<text x="1508" y="184" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">👥 Queue 3</text>
<circle cx="960" cy="540" r="4" fill="#f2f4f7" opacity="0.8"/>
<rect x="360" y="760" width="1200" height="110" rx="10" fill="#0f1215e6" stroke="none" stroke-width="2"/>
<text x="392" y="800" font-size="18" font-weight="700" fill="#E69F00" text-anchor="start">CUSTOMER</text>
<text x="392" y="842" font-size="28" font-weight="400" fill="#f2f4f7" text-anchor="start">“Something to help me sleep, but nothing too pricey.”</text>
<rect x="1180" y="330" width="600" height="62" rx="8" fill="#009E73" stroke="#009E73" stroke-width="2"/>
<text x="1204" y="370" font-size="22" font-weight="600" fill="#0b0d10" text-anchor="start">1  Look it up on the terminal</text>
<g class="note"><circle cx="1160" cy="361" r="17" fill="#CC79A7"/><text x="1160" y="368" font-size="18" font-weight="700" fill="#000" text-anchor="middle">1</text></g>
<rect x="1180" y="406" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="446" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">2  “What kind of experience are you looking for?”</text>
<g class="note"><circle cx="1160" cy="437" r="17" fill="#CC79A7"/><text x="1160" y="444" font-size="18" font-weight="700" fill="#000" text-anchor="middle">2</text></g>
<rect x="1180" y="482" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="522" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">3  “Any budget you want to stay under?”</text>
<g class="note"><circle cx="1160" cy="513" r="17" fill="#CC79A7"/><text x="1160" y="520" font-size="18" font-weight="700" fill="#000" text-anchor="middle">3</text></g>
<rect x="1180" y="558" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="598" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">4  “Anything you want to avoid?”</text>
<g class="note"><circle cx="1160" cy="589" r="17" fill="#CC79A7"/><text x="1160" y="596" font-size="18" font-weight="700" fill="#000" text-anchor="middle">4</text></g>
<rect x="1180" y="634" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="674" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">5  “Did you like anything last time?”</text>
<g class="note"><circle cx="1160" cy="665" r="17" fill="#CC79A7"/><text x="1160" y="672" font-size="18" font-weight="700" fill="#000" text-anchor="middle">5</text></g>
<text x="1780" y="315" font-size="18" font-weight="400" fill="#8f98a5" text-anchor="end">Questions left: 2 of 3</text>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-02 Dialogue: request + clarifying questions  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Subtitles: 28 px, max 2 lines, 1200 px box, speaker label 18 px. Options: number keys 1-5, D-pad ↑↓ + Ⓐ, or mouse.</text>
<text x="24" y="1176" font-size="19" fill="#222">Asked questions grey out. Each costs game time (DES-001 sets cost). Option 1 opens the terminal; the request line stays pinned there.</text>
<text x="24" y="1202" font-size="19" fill="#222">Customer reply to a question appears in the subtitle box and is appended to the request strip in the terminal.</text>
</svg>