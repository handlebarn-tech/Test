<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1230" viewBox="0 0 1920 1230" font-family="Segoe UI, Arial, sans-serif">
<title>PS1-08 Strike toast and shift report compliance rows</title>
<rect width="1920" height="1080" fill="#15181c"/>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#2b3038" stroke="none" stroke-width="2"/>
<text x="960.0" y="470" font-size="28" font-weight="400" fill="#4a525e" text-anchor="middle">first-person store view (graybox)</text>
<rect x="96" y="70" width="640" height="150" rx="10" fill="#0f1215e6" stroke="#D55E00" stroke-width="2"/>
<text x="124" y="112" font-size="24" font-weight="700" fill="#f2f4f7" text-anchor="start">✗ Strike · An invalid ID got through</text>
<text x="124" y="148" font-size="20" font-weight="400" fill="#c3c9d2" text-anchor="start">Stores can be fined up to $2,000 per violation.</text>
<text x="124" y="190" font-size="16" font-weight="400" fill="#8f98a5" text-anchor="start">6 s · logged to the shift report</text>
<rect width="1920" height="1080" fill="#000" opacity="0.55"/>
<rect x="560" y="250" width="800" height="780" rx="16" fill="#1d2127" stroke="#3a414c" stroke-width="2"/>
<text x="600" y="306" font-size="28" font-weight="700" fill="#f2f4f7" text-anchor="start">Shift report ★★☆</text>
<text x="600" y="350" font-size="18" font-weight="400" fill="#8f98a5" text-anchor="start">… slice rows unchanged (customers, revenue, satisfaction …)</text>
<text x="600" y="400" font-size="24" font-weight="700" fill="#f2f4f7" text-anchor="start">Compliance</text>
<text x="600" y="444" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Strikes</text>
<text x="1320" y="444" font-size="22" font-weight="600" fill="#E69F00" text-anchor="end">2  ⚠ Manager review</text>
<line x1="600" y1="458" x2="1320" y2="458" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="488" font-size="20" font-weight="400" fill="#8f98a5" text-anchor="start">  14:31 · An invalid ID got through</text>
<text x="1320" y="488" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end"></text>
<line x1="600" y1="502" x2="1320" y2="502" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="532" font-size="20" font-weight="400" fill="#8f98a5" text-anchor="start">  15:02 · Rang an out-of-state card as medical</text>
<text x="1320" y="532" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end"></text>
<line x1="600" y1="546" x2="1320" y2="546" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="576" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">IDs checked</text>
<text x="1320" y="576" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end">3</text>
<line x1="600" y1="590" x2="1320" y2="590" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="620" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Bad IDs caught</text>
<text x="1320" y="620" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end">1</text>
<line x1="600" y1="634" x2="1320" y2="634" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="664" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Valid IDs refused</text>
<text x="1320" y="664" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end">0</text>
<line x1="600" y1="678" x2="1320" y2="678" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="708" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Over-limit trims</text>
<text x="1320" y="708" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end">1</text>
<line x1="600" y1="722" x2="1320" y2="722" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="752" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Medical sales</text>
<text x="1320" y="752" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end">1</text>
<line x1="600" y1="766" x2="1320" y2="766" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="796" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Medical tax collected</text>
<text x="1320" y="796" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end">$x.xx</text>
<line x1="600" y1="810" x2="1320" y2="810" stroke="#3a414c" stroke-width="1"/>
<text x="600" y="840" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Adult-use tax collected</text>
<text x="1320" y="840" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="end">$xx.xx</text>
<line x1="600" y1="854" x2="1320" y2="854" stroke="#3a414c" stroke-width="1"/>
<rect x="1060" y="920" width="260" height="56" rx="8" fill="#262b33" stroke="#3a414c" stroke-width="2"/>
<text x="1190.0" y="956" font-size="22" font-weight="700" fill="#f2f4f7" text-anchor="middle">Close</text>
<text x="1190.0" y="1000" font-size="16" font-weight="400" fill="#8f98a5" text-anchor="middle">Esc / Enter</text>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">PS1-08 Strike toast and shift report compliance rows  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Strike toast: top-left like other toasts, ✗ + BAD colour, 6 s (longer than the 4 s sale toast), never steals focus; second line = flavour text for that strike (B4 for IDs).</text>
<text x="24" y="1176" font-size="19" fill="#222">Report: a 'Compliance' block below the slice rows. Strikes row shows count + '⚠ Manager review' at strikeReviewThreshold (2); one indented row per strike: time · reason.</text>
<text x="24" y="1202" font-size="19" fill="#222">Rows with zero events still show 0 (so players learn they exist). Medical rows hidden when the shift had no medical customer. Strikes never end the shift (DEC-032).</text>
</svg>