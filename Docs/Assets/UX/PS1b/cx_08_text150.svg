<text x="130" y="700" font-size="22" font-weight="400" fill="#8f98a5" text-anchor="start">ID panel at ≥125 %: DOB / EXP / TYPE / FORMAT also listed in a readout</text>
<text x="130" y="734" font-size="22" font-weight="400" fill="#8f98a5" text-anchor="start">column beside the card at full scale; they never ellipsize. NAME may.</text>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">CX-08 Text 150 % (REVIEW-W4L M1): register two-column, ID readout  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">At 125/150 % the register (1000 px wide) switches to two columns inside the full safe area: lines + Add item left; meter, totals, payment, Confirm right. It never scrolls; Confirm is always on screen.</text>
<text x="24" y="1176" font-size="19" fill="#222">Cart rows grow 80 → 96 → 112 px; name and batch line ellipsize (full name on focus tooltip and in Details); stepper, grams, price and ✕ keep fixed columns and never truncate.</text>
<text x="24" y="1202" font-size="19" fill="#222">Meter value and state text never truncate (state wraps to 2 lines). ID card scales up to fit the panel; any decision field that cannot reach the chosen scale on the card goes in the readout.</text>
</svg>