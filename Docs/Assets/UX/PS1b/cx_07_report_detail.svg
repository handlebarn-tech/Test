<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">CX-07 Report detail sections (Service · Consultation · Inventory · Flow)  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Tabs ← → (LB/RB); Esc returns to the summary. Each tab is one section; this frame stacks four for review only. Compliance = UX_PS1 §6 block unchanged.</text>
<text x="24" y="1176" font-size="19" fill="#222">'Average customer info' = band word (Complete / Partial / Need more), the same words as the counter tag. Relevant question rate as a %, a plain count ratio, not an evaluation value.</text>
<text x="24" y="1202" font-size="19" fill="#222">No row shows utilities, regret or TFS-oracle ranks (DEC-052). Rows sorted as DP §109–112; zero rows show 0.</text>
