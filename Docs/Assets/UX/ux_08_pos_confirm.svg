<text x="1420" y="500" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="end">$14.00</text>
<text x="500" y="544" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">Day deal: Tuesday House</text>
