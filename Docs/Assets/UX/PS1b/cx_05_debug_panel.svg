<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">CX-05 Dev debug panel (F3, debug builds only)  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Two fixed columns with their own header colour and rule: TFS left, GAMEPLAY right; a value never moves between them. Evaluation oracle values are a labelled sub-block of GAMEPLAY.</text>
<text x="24" y="1176" font-size="19" fill="#222">Rejection explanation: each line tagged [TFS] or [GAME]. Never 'the game knew the card was wrong'. Panel is non-modal, never takes focus, fixed 100 % text, F3 toggles (exists today).</text>
<text x="24" y="1202" font-size="19" fill="#222">Shows the serving customer, else the last served. Hidden in release builds (Debug.isDebugBuild || editor, as today); none of these values exist in player UI.</text>
</svg>