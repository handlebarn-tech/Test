<text x="650.0" y="960" font-size="16" font-weight="400" fill="#8f98a5" text-anchor="middle">Esc / Ⓑ</text>
<rect x="1120" y="880" width="300" height="56" rx="8" fill="#009E73" stroke="#009E73" stroke-width="2"/>
<text x="1270.0" y="916" font-size="22" font-weight="700" fill="#0b0d10" text-anchor="middle">Hold to confirm</text>
<text x="1270.0" y="960" font-size="16" font-weight="400" fill="#8f98a5" text-anchor="middle">Hold Enter / Ⓐ 0.6 s</text>
<rect x="96" y="70" width="640" height="140" rx="10" fill="#0f1215e6" stroke="#E69F00" stroke-width="2"/>
