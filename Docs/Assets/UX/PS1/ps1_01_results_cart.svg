<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">PS1-01 Results with a cart in progress (add another item)  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Cart open (≥1 line): the card's Choose becomes 'Add to cart' (same key). It presents the item; on ACCEPT the line is added and the register opens.</text>
<text x="24" y="1176" font-size="19" fill="#222">Request strip ticks each clause already in the cart (✓). Cart chip top-right: lines / 3 and summed grams; R or click → register without adding.</text>
<text x="24" y="1202" font-size="19" fill="#222">With 3 lines in the cart, 'Add to cart' is disabled with 'Cart full (3)'. Prices are placeholders; GAME-006 computes them (DEC-035, round once on the total).</text>
