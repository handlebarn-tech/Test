<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-04 Terminal: results (rush view, default)  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">3 cards max (resultCount 3). Card face = Floor Mode: name, sub-line, role tag, fit label, price, jar grams, one 'why' line, anxiety chip. No bars, no %, no scores.</text>
<text x="24" y="1176" font-size="19" fill="#222">←→ / LB-RB moves card focus; I inspect, C toggles compare (2-3), Enter chooses. Card 490×470; name 28, price 36, body 22, chips 18.</text>
<text x="24" y="1202" font-size="19" fill="#222">Prices shown are Tue day-deal post-tax 3.5 g from TIER_DEFAULTS/DEFAULT_DAY_DEALS (house 13.10, premium 17.50, smalls 8.75). Names/grams/text are placeholders.</text>
