<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">PS1-05 ID stand: card inspect, Admit / Refuse; counter queue stays visible  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Card shows photo, DOB, expiry, state, type, format (horizontal/vertical); the in-game date sits top-right of the panel. No verdict is shown: reading it is the decision.</text>
<text x="24" y="1176" font-size="19" fill="#222">While covering, the HUD becomes the 'Counter line' strip: one patience word+icon per queued customer (forced on, not the assist) + arrivals waiting at the stand.</text>
<text x="24" y="1202" font-size="19" fill="#222">Esc closes the panel; walking away leaves the remaining arrivals at the stand. Example: DOB 11/14/2005 on 10/27/2026 = age 20 → Refuse is correct.</text>
</svg>