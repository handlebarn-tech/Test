<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-06 Terminal: compare (2-3)  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Only decision-relevant rows (spec §19): price, type (cluster), anxiety, the key-difference domain, batch age. No raw chemistry; Inspect from a column opens Detail.</text>
<text x="24" y="1176" font-size="19" fill="#222">Key difference = largest display gap among the 5 shown domains; 'notably' when gap ≥10 (contract §11). Third column appears when 3 are selected.</text>
