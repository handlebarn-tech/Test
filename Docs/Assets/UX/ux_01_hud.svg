<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1230" viewBox="0 0 1920 1230" font-family="Segoe UI, Arial, sans-serif">
<title>UX-01 HUD (explore / idle)</title>
<rect width="1920" height="1080" fill="#15181c"/>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#2b3038" stroke="none" stroke-width="2"/>
<text x="960.0" y="470" font-size="28" font-weight="400" fill="#4a525e" text-anchor="middle">first-person store view (graybox)</text>
<rect x="1484" y="70" width="324" height="128" rx="10" fill="#0f1215cc" stroke="none" stroke-width="2"/>
<text x="1508" y="112" font-size="26" font-weight="600" fill="#f2f4f7" text-anchor="start">◷ 2:47 PM</text>
<text x="1508" y="150" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">$ 412.35 shift sales</text>
<text x="1508" y="184" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">👥 Queue 3</text>
<circle cx="960" cy="540" r="4" fill="#f2f4f7" opacity="0.8"/>
<rect x="810" y="880" width="300" height="56" rx="10" fill="#0f1215cc" stroke="none" stroke-width="2"/>
<text x="960" y="917" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="middle">E / Ⓐ  Talk</text>
<g class="note"><circle cx="1470" cy="90" r="17" fill="#CC79A7"/><text x="1470" y="97" font-size="18" font-weight="700" fill="#000" text-anchor="middle">1</text></g>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-01 HUD (explore / idle)  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Top-right cluster only: shift clock (game time), shift sales $, queue count. No patience bars (spec §27): patience is shown by NPC body language.</text>
<text x="24" y="1176" font-size="19" fill="#222">Interaction prompt appears only when a target is in reach (spec §62). Crosshair dot 8 px. HUD has no focusable elements; it hides while the terminal or POS is open.</text>
<text x="24" y="1202" font-size="19" fill="#222">Assist 'Patience hints' (off by default) adds a word under each queued NPC: Relaxed / Waiting / Impatient, with icon. Font: clock 26, other 22.</text>
</svg>