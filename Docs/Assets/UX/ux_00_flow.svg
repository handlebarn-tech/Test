<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1230" viewBox="0 0 1920 1230" font-family="Segoe UI, Arial, sans-serif">
<title>UX-00 Slice flow</title>
<rect width="1920" height="1080" fill="#15181c"/>
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#556"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<line x1="360" y1="230" x2="470" y2="230" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="415.0" y="218.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Interact NPC</text>
<line x1="580" y1="276" x2="580" y2="474" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="540.0" y="375.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Ask</text>
<line x1="620" y1="474" x2="620" y2="276" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="668.0" y="375.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Reply</text>
<line x1="730" y1="230" x2="850" y2="230" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="790.0" y="218.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Look it up</text>
<line x1="1110" y1="230" x2="1230" y2="230" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="1170.0" y="218.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Search</text>
<line x1="1490" y1="230" x2="1570" y2="230" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="1530.0" y="218.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Compare</text>
<line x1="1414" y1="276" x2="1646" y2="474" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="1490.0" y="385.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Inspect</text>
<line x1="1360" y1="276" x2="1360" y2="764" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="1310.0" y="520.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Choose</text>
<line x1="1230" y1="796" x2="1110" y2="796" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="1170.0" y="784.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">ACCEPT</text>
<line x1="1110" y1="824" x2="1230" y2="824" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="1170.0" y="854.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Cancel (release)</text>
<line x1="850" y1="810" x2="730" y2="810" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="790.0" y="798.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Confirm</text>
<line x1="470" y1="810" x2="360" y2="810" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<line x1="1330" y1="764" x2="1010" y2="276" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="1080.0" y="520.0" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">ASK_* (refine)</text>
<path d="M1360,856 Q795.0,1030 230,860" fill="none" stroke="#556" stroke-width="3" marker-end="url(#ah)"/>
<text x="795.0" y="960" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">REJECT / LEAVE (also on patience out, from any step)</text>
<rect x="100" y="184" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="230" y="238" font-size="22" font-weight="700" fill="#111" text-anchor="middle">HUD / explore</text>
<rect x="470" y="184" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="600" y="238" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Dialogue: request</text>
<rect x="470" y="474" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="600" y="528" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Clarify (≤3 Qs)</text>
<rect x="850" y="184" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="980" y="238" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Terminal: query</text>
<rect x="1230" y="184" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="1360" y="238" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Results (rush view)</text>
<rect x="1570" y="184" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="1700" y="238" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Compare</text>
<rect x="1570" y="474" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="1700" y="528" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Detail</text>
<rect x="1230" y="764" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="1360" y="818" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Present → response</text>
<rect x="850" y="764" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="980" y="818" font-size="22" font-weight="700" fill="#111" text-anchor="middle">POS confirm</text>
<rect x="470" y="764" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="600" y="818" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Feedback</text>
<rect x="100" y="764" width="260" height="92" rx="14" fill="#eef2f6" stroke="#334" stroke-width="2"/>
<text x="230" y="818" font-size="22" font-weight="700" fill="#111" text-anchor="middle">Customer leaves</text>
<text x="960" y="120" font-size="20" font-weight="400" fill="#333" text-anchor="middle">Back (Esc / B) always returns one step. Closing the terminal returns to the dialogue; the customer keeps waiting.</text>
<text x="1700" y="640" font-size="18" font-weight="600" fill="#a03" text-anchor="middle">Choose from Detail/Compare → Present</text>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-00 Slice flow  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Every node maps to one wireframe ux_01..ux_09. Patience keeps draining in every node except Feedback (spec §27).</text>
</svg>