<rect x="1120" y="850" width="120" height="6" rx="3" fill="#0b0d10" stroke="none" stroke-width="2"/>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-08 POS confirm  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Prices: contract §12, Tuesday deal, applyTax floor to $0.05 (10.50 → 13.10; tax line = total − subtotal). Weight tiles disabled when jar grams &lt; weight.</text>
<text x="24" y="1176" font-size="19" fill="#222">Confirm is hold-to-confirm by default (prevents double sale); setting 'Hold actions → Press' makes it a single press. Cancel releases the reservation (spec §67, §88).</text>
<text x="24" y="1202" font-size="19" fill="#222">Payment is abstract (spec §24-25). Focus: weight → payment → Confirm → Cancel. Panel 1000×840, total 36.</text>
</svg>