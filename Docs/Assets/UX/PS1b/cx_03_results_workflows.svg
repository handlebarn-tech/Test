<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">CX-03 Results: Details, Compare marks, Similar, Nothing fits  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Cards keep their TFS meaning only (rank order, fit label, price, grams). No completeness, risk, DQ or 'best' marker is ever drawn inside a card (DP §17, DEC-052).</text>
<text x="24" y="1176" font-size="19" fill="#222">Details (was Inspect, I) opens ux_05; Compare: mark 2–3 cards with C, then Compare n (Shift+C) opens ux_06 with the engine's compare. Each is a timed action; tag in words.</text>
<text x="24" y="1202" font-size="19" fill="#222">'Nothing fits right now' sits bottom-left, far from Choose, neutral style (it can be the right call); it opens a confirm card (CX-04). Shown after the first search for this customer.</text>
