<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1230" viewBox="0 0 1920 1230" font-family="Segoe UI, Arial, sans-serif">
<title>UX-07 Present choice → customer response</title>
<rect width="1920" height="1080" fill="#15181c"/>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#2b3038" stroke="none" stroke-width="2"/>
<text x="960.0" y="470" font-size="28" font-weight="400" fill="#4a525e" text-anchor="middle">customer at counter, jar of Strain A on counter</text>
<rect x="1484" y="70" width="324" height="128" rx="10" fill="#0f1215cc" stroke="none" stroke-width="2"/>
<text x="1508" y="112" font-size="26" font-weight="600" fill="#f2f4f7" text-anchor="start">◷ 2:47 PM</text>
<text x="1508" y="150" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">$ 412.35 shift sales</text>
<text x="1508" y="184" font-size="22" font-weight="400" fill="#c3c9d2" text-anchor="start">👥 Queue 3</text>
<circle cx="960" cy="540" r="4" fill="#f2f4f7" opacity="0.8"/>
<rect x="360" y="760" width="1200" height="110" rx="10" fill="#0f1215e6" stroke="none" stroke-width="2"/>
<text x="392" y="800" font-size="18" font-weight="700" fill="#E69F00" text-anchor="start">CUSTOMER</text>
<text x="392" y="842" font-size="28" font-weight="400" fill="#f2f4f7" text-anchor="start">“Hmm, is there anything a bit cheaper?”</text>
<rect x="96" y="70" width="520" height="90" rx="10" fill="#0f1215e6" stroke="none" stroke-width="2"/>
<text x="120" y="108" font-size="22" font-weight="600" fill="#f2f4f7" text-anchor="start">Presented: Strain A · 3.5 g · $13.10</text>
<text x="120" y="142" font-size="18" font-weight="400" fill="#8f98a5" text-anchor="start">Response: ASK_CHEAPER</text>
<rect x="1180" y="400" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="440" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">1  Ring it up anyway</text>
<g class="note"><circle cx="1160" cy="431" r="17" fill="#CC79A7"/><text x="1160" y="438" font-size="18" font-weight="700" fill="#000" text-anchor="middle">1</text></g>
<rect x="1180" y="476" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="516" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">2  Show a cheaper option (terminal)</text>
<g class="note"><circle cx="1160" cy="507" r="17" fill="#CC79A7"/><text x="1160" y="514" font-size="18" font-weight="700" fill="#000" text-anchor="middle">2</text></g>
<rect x="1180" y="552" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="592" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">3  “This one's the best fit for sleep.”</text>
<g class="note"><circle cx="1160" cy="583" r="17" fill="#CC79A7"/><text x="1160" y="590" font-size="18" font-weight="700" fill="#000" text-anchor="middle">3</text></g>
<rect x="1180" y="628" width="600" height="62" rx="8" fill="#0f1215e6" stroke="#3a414c" stroke-width="2"/>
<text x="1204" y="668" font-size="22" font-weight="400" fill="#f2f4f7" text-anchor="start">4  Let them go</text>
<g class="note"><circle cx="1160" cy="659" r="17" fill="#CC79A7"/><text x="1160" y="666" font-size="18" font-weight="700" fill="#000" text-anchor="middle">4</text></g>
<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">UX-07 Present choice → customer response  ·  1920×1080 @100% text  ·  pink = annotation layer (focus order, safe area 96/54 px)</text>
<text x="24" y="1150" font-size="19" fill="#222">Choosing on the terminal closes it and presents the batch (spec §17 states). ACCEPT skips this menu and opens POS.</text>
<text x="24" y="1176" font-size="19" fill="#222">Each response state has its own option set; 'terminal' options reopen Results with a refine applied (DES-001 maps ASK_* to crit/neg/maxPrice edits).</text>
<text x="24" y="1202" font-size="19" fill="#222">Pinned 'Presented' card top-left so the player keeps context. Same dialogue layout as UX-02.</text>
</svg>