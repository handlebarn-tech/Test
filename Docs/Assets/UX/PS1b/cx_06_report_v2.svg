<rect x="96" y="54" width="1728" height="972" fill="none" stroke="#CC79A7" stroke-width="1.5" stroke-dasharray="10 8" class="note"/>
<rect x="0" y="1080" width="1920" height="150" fill="#ffffff"/>
<text x="24" y="1116" font-size="24" font-weight="700" fill="#111">CX-06 Shift report v2: star gate, categories, revenue apart  ·  1920×1080 @100% text  ·  pink = annotation (focus order, safe area)</text>
<text x="24" y="1150" font-size="19" fill="#222">Stars come from the gate (DP §106), never from an average; a severe flag caps them and the reason line says so ('capped: {flag}'). Bands are words + shape icons, never colour only.</text>
<text x="24" y="1176" font-size="19" fill="#222">Revenue sits in its own dashed box outside the category row. Decision quality and satisfaction show as words (§23 bands / satisfaction band), never as numbers or per card.</text>
<text x="24" y="1202" font-size="19" fill="#222">Detail buttons open CX-07. Waste shows '—' until a waste mechanic exists. Rows for systems that are not built yet hide instead of showing 0 (restock rows wait for GAME-012).</text>
</svg>